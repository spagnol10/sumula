spring:
  application:
    name: sumula-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sumula}
    username: ${DATABASE_USERNAME:sumula}
    password: ${DATABASE_PASSWORD:sumula}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

sumula:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:3000}
